name: validate

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the sign-off check reads the commits of the pull request
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refuse licensed documents
        run: |
          if git ls-files | grep -iE '\.pdf$'; then
            echo "PDF files must not be committed (licensed standards)."; exit 1
          fi
      - name: Require sign-off (see CONTRIBUTING.md)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "Missing Signed-off-by: $(git log -1 --format='%h %s' "$commit")"; missing=1
            fi
          done
          exit $missing
      - run: python tools/lg.py validate
      - run: python tools/lg.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lawful-good-bundle
          path: dist/lawful-good.json
