schema_version: '0.1'
kind: assessment-catalog
id: decaid.ai-system-assessment
title:
  de: DECAID Prüfkatalog KI-Systemprüfung
  en: DECAID AI System Assessment Catalog
version: 0.2.0
publisher: DECAID
license: CC-BY-4.0
verification:
  status: verified-against-source
  date: '2026-10-23'
  note: Converted from the DECAID assessment catalog v0.2 (2026-10-23). Pilot version. Check items are DECAID's own wording. Not yet calibrated on three real assessments;
    scoring, weights, criticality and decision logic are intentionally not published.
translation_status: machine-assisted-review-needed
principles:
- de: Bewertet wird ein konkreter Use Case, keine pauschale Anbieter- oder Modellfreigabe.
  en: A specific use case is assessed, never a blanket approval of a provider or model.
- de: Jedes Szenario (Kanal, Betriebsmodus, Konfiguration) wird separat bewertet. Ein Ergebnis gilt nur
    für das geprüfte Szenario, die geprüfte Version und den Stichtag.
  en: Every scenario (channel, operating mode, configuration) is assessed separately. A result is valid
    only for the assessed scenario, version and reference date.
- de: Anwendbarkeit, Erfüllung, Reifegrad und Evidenz werden getrennt betrachtet.
  en: Applicability, fulfilment, maturity and evidence are considered separately.
- de: „Nicht anwendbar“ nur mit nachvollziehbarer Begründung.
  en: '"Not applicable" only with a traceable justification.'
- de: Anbieterangaben sind ein Input. Wesentliche Kontrollen brauchen nachvollziehbare Evidenz.
  en: Provider statements are an input. Key controls need traceable evidence.
- de: Offene Rechtsfragen werden rechtlich geklärt und nicht als Managemententscheidung behandelt.
  en: Open legal questions are clarified by legal experts and not treated as management decisions.
- de: Reifegrad und Prüfergebnis ersetzen keine rechtliche Bewertung, keine technische Sicherheitsprüfung
    und keine Entscheidung des Betreibers.
  en: Maturity and assessment results do not replace a legal assessment, a technical security test or
    the operator's decision.
maturity_levels:
- level: 0
  name: Not met
  definition:
    de: Anforderung nicht erfüllt oder keine belastbare Evidenz vorhanden.
    en: Requirement not met or no reliable evidence available.
- level: 1
  name: Basic
  definition:
    de: 'Mindestanforderung: Zweck und Verantwortlichkeit sind dokumentiert.'
    en: 'Minimum requirement: purpose and responsibility are documented.'
- level: 2
  name: Advanced
  definition:
    de: Kontrolle ist umgesetzt; Rollen, Nachweise und Anwendung im Use Case sind nachvollziehbar.
    en: Control is implemented; roles, evidence and application in the use case are traceable.
- level: 3
  name: High
  definition:
    de: Wirksamkeit wird regelmäßig getestet oder überwacht und bei Änderungen angepasst.
    en: Effectiveness is regularly tested or monitored and adjusted on changes.
gates:
- id: G0
  name:
    de: Triage
    en: Triage
  focus:
    de: Scope, Risiko und Prüftiefe festlegen
    en: Define scope, risk and depth of assessment
  guiding_question:
    de: Was genau wird in welchem Kontext geprüft?
    en: What exactly is assessed, and in which context?
- id: G1
  name:
    de: Zweck
    en: Purpose
  focus:
    de: Zweckbestimmung, Grenzen und menschliche Entscheidung
    en: Intended purpose, limits and human decision
  guiding_question:
    de: Was soll das System tun – und was nicht?
    en: What should the system do – and what not?
- id: G2
  name:
    de: Daten
    en: Data
  focus:
    de: Datenarten, Quellen, Datenschutz, RAG und Transfers
    en: Data types, sources, data protection, RAG and transfers
  guiding_question:
    de: Welche Daten werden wie und warum verarbeitet?
    en: Which data is processed, how and why?
- id: G3
  name:
    de: Rollen
    en: Roles
  focus:
    de: Verantwortung, menschliche Kontrolle, Kompetenzen und Eskalation
    en: Responsibility, human oversight, competences and escalation
  guiding_question:
    de: Wer trägt welche Verantwortung und kann eingreifen?
    en: Who is responsible for what, and who can intervene?
- id: G4
  name:
    de: Technik
    en: Technology
  focus:
    de: Architektur, Rechte, Verhalten, Sicherheit, Monitoring und Betrieb
    en: Architecture, permissions, behaviour, security, monitoring and operations
  guiding_question:
    de: Wie verhält sich das System technisch und im Betrieb?
    en: How does the system behave technically and in operation?
- id: G5
  name:
    de: Entscheidung
    en: Decision
  focus:
    de: Befunde, Auflagen, Freigabeempfehlung und Reassessment
    en: Findings, conditions, approval recommendation and reassessment
  guiding_question:
    de: Unter welchen Bedingungen ist der geprüfte Scope vertretbar?
    en: Under which conditions is the assessed scope acceptable?
evidence_types:
- id: documentation
  name:
    de: Dokumentation
    en: Documentation
  examples:
    de: Richtlinie, Prozessbeschreibung, Architekturdiagramm
    en: Policy, process description, architecture diagram
- id: self-declaration
  name:
    de: Selbstauskunft
    en: Self-declaration
  examples:
    de: Schriftliche Angabe des Anbieters oder Betreibers
    en: Written statement by the provider or operator
- id: interview
  name:
    de: Gesprächsergebnis
    en: Interview result
  examples:
    de: Protokollierte Aussage aus Interview oder Workshop
    en: Recorded statement from an interview or workshop
- id: observed-ui
  name:
    de: Beobachtetes UI-Verhalten
    en: Observed UI behaviour
  examples:
    de: Beobachtung der Oberfläche mit Datum und Testkonto
    en: Observation of the interface with date and test account
- id: spot-check
  name:
    de: Technische Funktionsstichprobe
    en: Technical spot check
  examples:
    de: Stichprobe mit definierten Eingaben und Ergebnisprotokoll
    en: Sample with defined inputs and a result log
- id: config-review
  name:
    de: Passiver Konfigurationsreview
    en: Passive configuration review
  examples:
    de: Sichtung von Einstellungen ohne Eingriff
    en: Review of settings without changing them
- id: security-test
  name:
    de: Aktiver Sicherheitstest
    en: Active security test
  examples:
    de: Test mit Angriffs- oder Fehlerszenarien im vereinbarten Rahmen
    en: Test with attack or failure scenarios within the agreed scope
- id: vendor-source
  name:
    de: Externe Anbieterquelle
    en: External provider source
  examples:
    de: Zertifikat, Whitepaper oder Herstellerangabe ohne eigene Prüfung
    en: Certificate, white paper or vendor statement without own verification
modules:
- id: generated-content
  name:
    de: Generierte Inhalte
    en: Generated content
  applies_if:
    de: Das System erzeugt Bilder, Audio, Video oder Texte, die an Menschen oder andere Systeme weitergegeben
      werden.
    en: The system generates images, audio, video or text that is passed on to people or other systems.
  output_channels:
  - id: direct-download
    name:
      de: Direktdownload
      en: Direct download
    check:
      de: Bleibt die Kennzeichnung im heruntergeladenen Original erhalten?
      en: Is the labelling preserved in the downloaded original?
  - id: qr-download
    name:
      de: QR-Download
      en: QR download
    check:
      de: Bleibt die Kennzeichnung nach dem Abruf über QR-Code auf dem Zielgerät erhalten?
      en: Is the labelling preserved on the target device after retrieval via QR code?
  - id: mobile-storage
    name:
      de: Smartphone-Speicherung
      en: Smartphone storage
    check:
      de: Bleiben Metadaten bei Speicherung in Fotos oder Dateien erhalten?
      en: Are metadata preserved when saved to photos or files?
  - id: messenger
    name:
      de: Messenger-Weitergabe
      en: Messenger sharing
    check:
      de: Werden Metadaten durch den Messenger entfernt oder verändert?
      en: Does the messenger remove or alter metadata?
  - id: social-media
    name:
      de: Social-Media-Upload
      en: Social media upload
    check:
      de: Werden Metadaten oder Wasserzeichen durch die Plattform entfernt?
      en: Does the platform remove metadata or watermarks?
  - id: archive-export
    name:
      de: Archiv-/ZIP-Export
      en: Archive/ZIP export
    check:
      de: Bleibt die Kennzeichnung im Archiv und im Export erhalten?
      en: Is the labelling preserved in the archive and the export?
  - id: re-editing
    name:
      de: Erneute Komprimierung / Bearbeitung
      en: Re-compression / editing
    check:
      de: Bleibt die Kennzeichnung nach Kompression, Zuschnitt oder Bearbeitung erhalten?
      en: Is the labelling preserved after compression, cropping or editing?
  checks:
  - de: Welche Kennzeichnung ist vorhanden (IPTC/XMP, C2PA, Anbieter-Wasserzeichen, sonstige Markierung)?
    en: Which labelling is present (IPTC/XMP, C2PA, provider watermark, other marking)?
  - de: Wo wird sie erzeugt (Modellanbieter, Nachbearbeitung durch den Betreiber, Exportprozess)?
    en: Where is it created (model provider, post-processing by the operator, export process)?
  - de: Welche Transformationen überlebt sie?
    en: Which transformations does it survive?
  - de: Mit welchem Werkzeug (und welcher Version) wurde sie geprüft?
    en: Which tool (and version) was used to check it?
  - de: Ist die Kennzeichnung modell- und providerunabhängig?
    en: Is the labelling independent of model and provider?
  - de: Ist der Archivpfad ebenfalls abgedeckt?
    en: Is the archive path covered as well?
  - de: Welche sichtbare Offenlegung besteht für Menschen?
    en: Which visible disclosure exists for people?
  notes:
  - de: Geprüft wird das Ergebnis am Ausgabeweg, nicht nur die Originaldatei.
    en: Check the result at the output channel, not only the original file.
  - de: Ein positives Ergebnis mit einem Anbieter-Detektor ist ein Nachweis für diesen Detektor, kein
      Beweis, dass jede Person oder jedes System die Kennzeichnung erkennt.
    en: A positive result from a provider's detector proves that detector only, not that every person
      or system recognises the labelling.
  - de: Anbieter- und Betreiberpflichten je Transparenzpunkt getrennt erfassen und nicht vermischen. Die
      rechtliche Einordnung im Einzelfall bleibt Aufgabe der Rechtsberatung.
    en: Record provider and deployer duties separately for each transparency point and do not mix them.
      Legal classification in a specific case remains a matter for legal advice.
items:
- id: G0-01
  gate: G0
  category:
    de: Triage
    en: Triage
  subcategory:
    de: Use Case und Scope
    en: Use case and scope
  question:
    de: Ist der konkrete Use Case mit Zweck, Nutzergruppen, betroffenen Personen und Einsatzkontext eindeutig
      beschrieben?
    en: Is the specific use case clearly described, including purpose, user groups, affected persons and
      context of use?
  criteria:
    basic:
      de: Use Case, Nutzer und Einsatzkontext sind dokumentiert.
      en: Use case, users and context of use are documented.
    advanced:
      de: Scope ist mit Fachbereich, Betreiber und relevanten Stakeholdern abgestimmt; Abgrenzungen sind
        nachvollziehbar.
      en: Scope is agreed with the business unit, operator and relevant stakeholders; boundaries are traceable.
    high:
      de: Scope wird bei Änderungen aktualisiert und regelmäßig auf Gültigkeit geprüft.
      en: Scope is updated on changes and regularly checked for validity.
  evidence:
  - de: Use-Case-Steckbrief
    en: Use case profile
  - de: Prozessbeschreibung
    en: Process description
  - de: Stakeholderliste
    en: Stakeholder list
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Interview
    en: Interview
  reassessment_triggers:
  - de: Änderung von Zweck, Nutzergruppe oder Einsatzkontext
    en: Change of purpose, user group or context of use
  references:
  - EU AI Act
  - NIST AI RMF
  note:
    de: Grundlage für die gesamte Prüfung.
    en: Basis for the entire assessment.
- id: G0-02
  gate: G0
  category:
    de: Triage
    en: Triage
  subcategory:
    de: Systemgrenzen
    en: System boundaries
  question:
    de: Sind Modell, Prompts, RAG/Quellen, Integrationen, Rechte und mögliche Aktionen als ein konkretes
      System abgegrenzt?
    en: Are model, prompts, RAG/sources, integrations, permissions and possible actions delimited as one
      concrete system?
  criteria:
    basic:
      de: Systemkomponenten und Systemgrenze sind dokumentiert.
      en: System components and system boundary are documented.
    advanced:
      de: Datenfluss, Abhängigkeiten und Aktionsmöglichkeiten sind nachvollziehbar dargestellt.
      en: Data flow, dependencies and possible actions are traceably described.
    high:
      de: Systeminventar und Abhängigkeiten werden versioniert und bei Änderungen neu bewertet.
      en: System inventory and dependencies are versioned and reassessed on changes.
  evidence:
  - de: Architekturübersicht
    en: Architecture overview
  - de: Datenfluss
    en: Data flow
  - de: Komponenten-/Providerliste
    en: Component and provider list
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Architekturreview
    en: Architecture review
  reassessment_triggers:
  - de: Modell-, Prompt-, Provider- oder Integrationswechsel
    en: Change of model, prompt, provider or integration
  references:
  - NIST AI RMF
  - ISO/IEC 23894
  - OWASP (LLM Top 10, AI Exchange)
  note:
    de: Nicht nur das Basismodell prüfen.
    en: Do not assess the base model only.
- id: G0-03
  gate: G0
  category:
    de: Triage
    en: Triage
  subcategory:
    de: Risiko und Betroffenheit
    en: Risk and affected persons
  question:
    de: Sind potenziell betroffene Personen, kritische Entscheidungen, Schadensszenarien und relevante
      Domänenrisiken identifiziert?
    en: Are potentially affected persons, critical decisions, harm scenarios and relevant domain risks
      identified?
  criteria:
    basic:
      de: Betroffene, Entscheidungen und wesentliche Schadensszenarien sind benannt.
      en: Affected persons, decisions and key harm scenarios are named.
    advanced:
      de: Risiken sind priorisiert und mit dem vorgesehenen Nutzungskontext verknüpft.
      en: Risks are prioritised and linked to the intended context of use.
    high:
      de: Risikoprofil wird anhand von Vorfällen, Monitoring und Änderungen aktualisiert.
      en: The risk profile is updated based on incidents, monitoring and changes.
  evidence:
  - de: Risikobeschreibung
    en: Risk description
  - de: Prozesskarte
    en: Process map
  - de: Impact-Analyse
    en: Impact analysis
  methods:
  - de: Interview
    en: Interview
  - de: Dokumentenprüfung
    en: Document review
  reassessment_triggers:
  - de: Neue betroffene Gruppe, neue Entscheidung oder neuer Schadensfall
    en: New affected group, new decision or new harm case
  references:
  - EU AI Act
  - GDPR
  - ISO/IEC 23894
  note:
    de: Keine pauschale Einstufung ohne Use-Case-Kontext.
    en: No blanket classification without the use case context.
- id: G0-04
  gate: G0
  category:
    de: Triage
    en: Triage
  subcategory:
    de: Assessmentpfad
    en: Assessment path
  question:
    de: Ist die erforderliche Prüftiefe begründet ausgewählt und sind offene Vorbedingungen sichtbar?
    en: Is the required depth of assessment selected with a rationale, and are open preconditions visible?
  criteria:
    basic:
      de: Assessmentpfad und Begründung sind dokumentiert.
      en: Assessment path and rationale are documented.
    advanced:
      de: Prüftiefe ist an Risiko, Systemkomplexität und Evidenzlage ausgerichtet.
      en: Depth of assessment is aligned with risk, system complexity and available evidence.
    high:
      de: Prüftiefe wird bei neuen Erkenntnissen oder Triggern angepasst.
      en: Depth of assessment is adjusted when new findings or triggers arise.
  evidence:
  - de: Triage-Entscheidung
    en: Triage decision
  - de: Scope-Notiz
    en: Scope note
  - de: offene Punkte
    en: Open points
  methods:
  - de: Triage-Workshop
    en: Triage workshop
  reassessment_triggers:
  - de: Neue Evidenz oder höhere Risikoeinschätzung
    en: New evidence or higher risk estimate
  references:
  - NIST AI RMF
  - ISO/IEC 23894
- id: G1-01
  gate: G1
  category:
    de: Zweck
    en: Purpose
  subcategory:
    de: Zweckbestimmung
    en: Intended purpose
  question:
    de: Ist der beabsichtigte Zweck einschließlich zulässiger und unzulässiger Nutzung dokumentiert?
    en: Is the intended purpose documented, including permitted and non-permitted use?
  criteria:
    basic:
      de: Intended purpose und wesentliche Grenzen sind dokumentiert.
      en: Intended purpose and key limits are documented.
    advanced:
      de: Zweck und Grenzen sind mit Fachbereich, Betreiber und Nutzern abgestimmt.
      en: Purpose and limits are agreed with the business unit, operator and users.
    high:
      de: Zweckverletzungen werden überwacht; Änderungen lösen eine Neubewertung aus.
      en: Use outside the purpose is monitored; changes trigger a reassessment.
  evidence:
  - de: Zweckbeschreibung
    en: Purpose description
  - de: Nutzungsrichtlinie
    en: Usage policy
  - de: Prozessbeschreibung
    en: Process description
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Interview
    en: Interview
  reassessment_triggers:
  - de: Änderung der Zweckbestimmung oder Nutzung
    en: Change of intended purpose or use
  references:
  - EU AI Act
  - NIST AI RMF
- id: G1-02
  gate: G1
  category:
    de: Zweck
    en: Purpose
  subcategory:
    de: Menschliche Entscheidung
    en: Human decision
  question:
    de: Ist klar definiert, welche Entscheidungen Menschen treffen, welche Ausgaben das System liefert
      und wo menschliches Ermessen erforderlich bleibt?
    en: Is it clearly defined which decisions people make, which outputs the system provides and where
      human judgement remains necessary?
  criteria:
    basic:
      de: Menschliche Rolle und Entscheidungsgrenzen sind beschrieben.
      en: The human role and decision boundaries are described.
    advanced:
      de: Übersteuerung, Ablehnung und Eskalation sind praktisch vorgesehen und getestet.
      en: Override, rejection and escalation are provided for in practice and tested.
    high:
      de: Wirksamkeit der menschlichen Kontrolle wird überwacht und regelmäßig überprüft.
      en: The effectiveness of human control is monitored and regularly reviewed.
  evidence:
  - de: Rollenbeschreibung
    en: Role description
  - de: Prozess
    en: Process
  - de: Kontrollnachweise
    en: Control evidence
  - de: Testfälle
    en: Test cases
  methods:
  - de: Prozessreview
    en: Process review
  - de: Verhaltenstest
    en: Behaviour test
  reassessment_triggers:
  - de: Änderung von Automatisierungsgrad oder Entscheidungskompetenz
    en: Change of automation level or decision authority
  references:
  - EU AI Act
  - NIST AI RMF
- id: G1-03
  gate: G1
  category:
    de: Zweck
    en: Purpose
  subcategory:
    de: Ausgaben und Grenzen
    en: Outputs and limits
  question:
    de: Sind erwartbare Ausgaben, Unsicherheiten, Fehlermodi und Grenzen der Nutzung verständlich beschrieben?
    en: Are expected outputs, uncertainties, failure modes and limits of use described in an understandable
      way?
  criteria:
    basic:
      de: Ausgaben und bekannte Grenzen sind dokumentiert.
      en: Outputs and known limits are documented.
    advanced:
      de: Grenzen werden im Interface, Prozess und Training berücksichtigt.
      en: Limits are reflected in the interface, the process and training.
    high:
      de: Fehlermodi werden aus Monitoring und Tests kontinuierlich ergänzt.
      en: Failure modes are continuously added from monitoring and tests.
  evidence:
  - de: Produktdokumentation
    en: Product documentation
  - de: Nutzerhinweise
    en: User guidance
  - de: Testfälle
    en: Test cases
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Verhaltenstest
    en: Behaviour test
  reassessment_triggers:
  - de: Neue Fehlermuster oder relevante Modelländerung
    en: New failure patterns or relevant model change
  references:
  - NIST AI RMF
  - OWASP (LLM Top 10, AI Exchange)
- id: G1-04
  gate: G1
  category:
    de: Zweck
    en: Purpose
  subcategory:
    de: Regulatorische Einordnung
    en: Regulatory classification
  question:
    de: Sind die einschlägigen regulatorischen und sektoralen Anforderungen für den Use Case geprüft und
      dokumentiert?
    en: Have the relevant regulatory and sector-specific requirements for the use case been checked and
      documented?
  criteria:
    basic:
      de: Anwendbare Rechts- und Regelungsbereiche sind identifiziert.
      en: Applicable areas of law and regulation are identified.
    advanced:
      de: Anforderungen sind in Kontrollen, Nachweise und Verantwortlichkeiten übersetzt.
      en: Requirements are translated into controls, evidence and responsibilities.
    high:
      de: Regulatorische Änderungen werden beobachtet und in die Neubewertung überführt.
      en: Regulatory changes are tracked and fed into reassessment.
  evidence:
  - de: Regulatory Scoping
    en: Regulatory scoping
  - de: Datenschutzbewertung
    en: Data protection assessment
  - de: Fachbereichsfreigabe
    en: Business owner approval
  methods:
  - de: Regulatory Review
    en: Regulatory review
  reassessment_triggers:
  - de: Neue Rechtslage, neue Domäne oder neue Funktion
    en: New legal situation, new domain or new function
  references:
  - EU AI Act
  - GDPR
  - Sector-specific rules
- id: G1-05
  gate: G1
  category:
    de: Zweck
    en: Purpose
  subcategory:
    de: Erfolgskriterien
    en: Success criteria
  question:
    de: Sind fachliche Akzeptanzkriterien und Mindestqualität für den geprüften Zweck definiert?
    en: Are business acceptance criteria and minimum quality defined for the assessed purpose?
  criteria:
    basic:
      de: Akzeptanzkriterien und Mindestqualität sind dokumentiert.
      en: Acceptance criteria and minimum quality are documented.
    advanced:
      de: Kriterien sind messbar, getestet und mit einer Entscheidung verknüpft.
      en: Criteria are measurable, tested and linked to a decision.
    high:
      de: Kriterien werden anhand realer Nutzung und Monitoring angepasst.
      en: Criteria are adjusted based on real use and monitoring.
  evidence:
  - de: Akzeptanzkriterien
    en: Acceptance criteria
  - de: Testplan
    en: Test plan
  - de: Qualitätsmetriken
    en: Quality metrics
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Testreview
    en: Test review
  reassessment_triggers:
  - de: Änderung von Zweck, Daten oder Qualitätsziel
    en: Change of purpose, data or quality target
  references:
  - NIST AI RMF
  - ISO/IEC 23894
- id: G2-01
  gate: G2
  category:
    de: Daten & Recht
    en: Data and law
  subcategory:
    de: Dateninventar
    en: Data inventory
  question:
    de: Sind Datenarten, Quellen, Verarbeitungszwecke und Datenflüsse vollständig inventarisiert?
    en: Are data types, sources, processing purposes and data flows fully inventoried?
  criteria:
    basic:
      de: Datenarten, Quellen und Zwecke sind dokumentiert.
      en: Data types, sources and purposes are documented.
    advanced:
      de: Datenfluss und Verantwortlichkeiten sind nachvollziehbar; externe Quellen sind erfasst.
      en: Data flow and responsibilities are traceable; external sources are recorded.
    high:
      de: Inventar wird versioniert und bei Änderungen aktualisiert.
      en: The inventory is versioned and updated on changes.
  evidence:
  - de: Dateninventar
    en: Data inventory
  - de: Datenfluss
    en: Data flow
  - de: Verzeichnis der Verarbeitung
    en: Record of processing activities
  methods:
  - de: Dokumentenprüfung
    en: Document review
  - de: Datenflussreview
    en: Data flow review
  reassessment_triggers:
