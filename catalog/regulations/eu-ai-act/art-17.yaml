article: "17"
title:
  de: Qualitätsmanagementsystem
  en: Quality management system

addressees: [provider]

scope:
  de: Anbieter von Hochrisiko-KI-Systemen.
  en: Providers of high-risk AI systems.

application:
  - applies_to:
      de: Hochrisiko-KI-Systeme nach Art. 6 Abs. 2 und Anhang III
      en: High-risk AI systems under Article 6(2) and Annex III
    from: 2027-12-02
  - applies_to:
      de: Hochrisiko-KI-Systeme nach Art. 6 Abs. 1 und Anhang I
      en: High-risk AI systems under Article 6(1) and Annex I
    from: 2028-08-02

